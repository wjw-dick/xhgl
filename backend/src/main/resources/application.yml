server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  tomcat:
    max-http-form-post-size: 30MB

spring:
  application:
    name: xinhuo-boiler-platform
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/xh_boiler?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      pool-name: xh-hikari
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/seed.sql
      encoding: UTF-8
      continue-on-error: false
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 120MB
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 3s
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    connection-timeout: 3s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto
  mapper-locations: classpath*:mapper/**/*.xml

app:
  jwt-secret: ${JWT_SECRET:xinhuo-boiler-saas-platform-2026-secret-key-please-change}
  jwt-expire-hours: ${JWT_EXPIRE_HOURS:24}
  upload-dir: ${UPLOAD_DIR:./uploads}
  encrypt-key: ${APP_ENCRYPT_KEY:xinhuo-boiler-aes-key-2026-0001}
  rabbit-enabled: ${RABBIT_ENABLED:false}
  public-base-url: ${PUBLIC_BASE_URL:http://127.0.0.1:8080}
  cors-origins: ${CORS_ORIGINS:http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175,http://localhost:5173,http://localhost:5174,http://localhost:5175}

logging:
  level:
    root: INFO
    com.xinhuo.boiler: INFO
